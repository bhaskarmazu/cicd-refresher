name: Build and Push to ECR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app.py --max-line-length=100

  build-and-push:
    needs: [test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: list files
        run: ls -al

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::048280526216:role/github-actions-ecr-push
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: githubactions-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  #scan: #container vulnerability scan (Trivy)
  #  needs: build-and-push
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Configure AWS credentials via OIDC
  #      uses: aws-actions/configure-aws-credentials@v4
  #      with:
  #        role-to-assume: arn:aws:iam::048280526216:role/github-actions-ecr-push
  #        aws-region: us-east-1
#
  #    - name: Log in to Amazon ECR
  #      id: login-ecr
  #      uses: aws-actions/amazon-ecr-login@v2
#
  #    - name: Run Trivy scan
  #      uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4  # v0.35.0 — pinned by commit SHA
  #      with:
  #         image-ref: ${{ steps.login-ecr.outputs.registry }}/githubactions-app:${{ github.sha }}
  #          format: table
  #          severity: CRITICAL,HIGH
  #          exit-code: 1

  deploy: #deploy to EC2 instance
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::048280526216:role/github-actions-ecr-push
          aws-region: us-west-2

      - name: Deploy new image via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat <<EOF > deploy-commands.json
          {
            "commands": [
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 048280526216.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 048280526216.dkr.ecr.us-east-1.amazonaws.com/githubactions-app:${IMAGE_TAG}",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --name app -p 5000:5000 048280526216.dkr.ecr.us-east-1.amazonaws.com/githubactions-app:${IMAGE_TAG}"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters file://deploy-commands.json \
            --region us-west-2 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region us-west-2 || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region us-west-2 --query "Status" --output text)
          echo "Deploy status: $STATUS"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region us-west-2

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Get instance public IP
        id: get-ip
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --region us-west-2 --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ steps.get-ip.outputs.ip }}:5000